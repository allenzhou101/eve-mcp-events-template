name: Check app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Compile-only values. CI does not sign in, deploy, or contact Bird.
      - run: pnpm build:eve && pnpm build
        env:
          VERCEL_URL: build.example.test
          VERCEL_APP_CLIENT_ID: build-only-client
          VERCEL_APP_CLIENT_SECRET: build-only-client-secret
          BETTER_AUTH_SECRET: build-only-secret-never-use-for-a-deployment
